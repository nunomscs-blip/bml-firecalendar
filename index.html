<!DOCTYPE html>
<html lang="pt">

<head>

    <!-- =======================================================
         CONFIGURAÇÃO DA PÁGINA
    ======================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BML FireCalendar</title>

    <!-- =======================================================
         FOLHAS DE ESTILO (CSS)
    ======================================================== -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =======================================================
         CABEÇALHO
    ======================================================== -->

    <header id="cabecalho">

        <div id="ladoEsquerdo">

            <button id="btnCancelar" class="btnCabecalho oculto">
                ✕
            </button>

            <h1 id="tituloApp"></h1>

        </div>

        <div id="acoesCabecalho">

            <button id="btnHoje" class="oculto">
                Hoje
            </button>

            <button id="btnConfiguracao" class="btnCabecalho">
                ⚙
            </button>

        </div>

    </header>

    <!-- =======================================================
         ÁREA PRINCIPAL
    ======================================================== -->

    <main id="app">

        <div id="legendaEventos"></div>

        <div id="calendario"></div>

    </main>

    <!-- =======================================================
         RODAPÉ
    ======================================================== -->

    <footer id="rodape"></footer>

    <!-- =======================================================
         BOTÃO NOVO EVENTO
    ======================================================== -->

    <button id="btnNovo">+</button>

    <!-- =======================================================
         MODAL EVENTO
    ======================================================== -->

    <div id="modalEvento" class="modal oculto">

        <div class="modalConteudo">

            <h2 id="tituloModal">Novo Evento</h2>

            <div class="campo">

                <label for="tipoEvento">Tipo</label>

                <select id="tipoEvento"></select>

            </div>

            <div class="campo">

                <label for="turnoEvento">Turno</label>

                <select id="turnoEvento">

                    <option value="D">Dia (07:00 - 19:00)</option>
                    <option value="N">Noite (19:00 - 07:00)</option>

                </select>

            </div>

            <div class="campo">

                <label>Dias selecionados</label>

                <div id="diasSelecionadosTexto">
                    Nenhum dia selecionado.
                </div>

            </div>

            <div class="campo">

                <label for="observacoesEvento">
                    Observações
                </label>

                <textarea
                    id="observacoesEvento"
                    rows="4"
                    placeholder="Opcional"></textarea>

            </div>

            <div class="botoesModal">

                <button id="btnCancelarEvento">
                    Cancelar
                </button>

                <button id="btnGuardarEvento">
                    Guardar
                </button>

            </div>

        </div>

    </div>

    <!-- =======================================================
     MODAL EVENTOS DO DIA
======================================================= -->

<div id="modalEventos" class="painel oculto">

    <div class="painelConteudo">

        <div class="painelCabecalho">

    <div class="barraArrasto"></div>

    <div class="tituloPainel">

        <h2 id="tituloModalEventos">
            Eventos do dia
        </h2>

        <button
            id="btnFecharPainelEventos"
            class="btnFecharPainel">

            ✕

        </button>

    </div>

</div>

<div class="painelCorpo">
            <div id="listaEventosDia"></div>

        </div> <!-- Fecha painelCorpo -->

        <div class="painelRodape">

            <div class="botoesModal">

                <button id="btnFecharEventos">
                    Fechar
                </button>

            </div>

        </div>

    </div>

</div>
    <!-- =======================================================
         MODAL CONFIGURAÇÃO
    ======================================================== -->

    <!-- =======================================================
     PAINEL CONFIGURAÇÃO
======================================================= -->

<div id="modalConfiguracao" class="painel oculto">

    <div class="painelConteudo">

        <div class="painelCabecalho">

            <div class="barraArrasto"></div>

            <div class="tituloPainel">

                <h2>Configuração</h2>

                <button
                    id="btnFecharConfiguracao"
                    class="btnFecharPainel">

                    ✕

                </button>

            </div>

        </div>

        <div class="painelCorpo">

            <div class="menuConfiguracao">

                <button id="btnTiposEvento">
                    📁 Tipos de Evento
                </button>

                <button id="btnTurnos">
                    🕒 Turnos
                </button>

                <button id="btnAlarmes">
                    🔔 Alarmes
                </button>

            </div>

        </div>

        <div class="painelRodape">

            <button id="btnFecharConfiguracaoRodape">

                Fechar

            </button>

        </div>

    </div>

</div>

    <!-- =======================================================
         MODAL TIPOS DE EVENTO
    ======================================================== -->

    <div id="modalTiposEvento" class="painel oculto">

    <div class="painelConteudo">

        <div class="painelCabecalho">

            <div class="barraArrasto"></div>

            <div class="tituloPainel">

                <h2>Tipos de Evento</h2>

                <button
                    id="btnFecharTiposEvento"
                    class="btnFecharPainel">

                    ✕

                </button>

            </div>

        </div>

        <div class="painelCorpo">

            <div id="listaTiposEvento"></div>

        </div>

        <div class="painelRodape">

            <div class="botoesModal">

                <button id="btnFecharTiposEventoRodape">
                    Fechar
                </button>

            </div>

        </div>

    </div>

</div>

<!-- =======================================================
     MODAL EDITAR TIPO DE EVENTO
======================================================= -->

<div id="modalEditarTipoEvento" class="modal oculto">

    <div class="modalConteudo">

        <h2>Editar Tipo de Evento</h2>

        <div class="campo">

            <label>Nome</label>

            <input
                type="text"
                id="editarNomeTipo">

        </div>

        <div class="campo">

            <label>Cor</label>

            <input
                type="color"
                id="editarCorTipo">

        </div>

        <div class="campo">

            <label>

                <input
                    type="checkbox"
                    id="editarTipoAtivo">

                Ativo

            </label>

        </div>

        <div class="campo">

            <label>

                <input
                    type="checkbox"
                    id="editarTipoTurnos">

                Possui turnos

            </label>

        </div>

        <div id="zonaTurnosTipo">

            <div class="campo">

                <label>Turno Dia</label>

                <div class="linhaHoras">

                    <input type="time" id="diaInicio">

                    <input type="time" id="diaFim">

                </div>

            </div>

            <div class="campo">

                <label>Turno Noite</label>

                <div class="linhaHoras">

                    <input type="time" id="noiteInicio">

                    <input type="time" id="noiteFim">

                </div>

            </div>

        </div>

        <div class="botoesModal">

            <button id="btnCancelarEditarTipo">

                Cancelar

            </button>

            <button id="btnGuardarEditarTipo">

                Guardar

            </button>

        </div>

    </div>

</div>

    <!-- =======================================================
         MODAL ELIMINAR EVENTO
    ======================================================== -->

    <div id="modalEliminar" class="modal oculto">

        <div class="modalConteudo">

            <h2>Eliminar Evento</h2>

            <p class="textoAlerta">
                Ao continuar, o evento será eliminado definitivamente do sistema.
            </p>

            <p class="textoAlerta">
                Esta ação não pode ser anulada.
            </p>

            <label class="confirmacaoEliminar">

                <input
                    type="checkbox"
                    id="chkConfirmarEliminar">

                Confirmo que pretendo eliminar definitivamente este evento.

            </label>

            <div class="botoesModal">

                <button id="btnCancelarEliminar">
                    Cancelar
                </button>

                <button
                    id="btnConfirmarEliminar"
                    class="botaoPerigo"
                    disabled>

                    Eliminar

                </button>

            </div>

        </div>

    </div>

    <!-- =======================================================
         TOAST
    ======================================================== -->

    <div id="toast" class="toast oculto"></div>

    <!-- =======================================================
         SCRIPTS
         Ordem importante:
         1 - Configuração
         2 - Datas
         3 - Calendário
         4 - Base de Dados
         5 - Aplicação
    ======================================================== -->

    <script src="js/config.js"></script>
    <script src="js/datas.js"></script>
    <script src="js/calendario.js"></script>
    <script src="js/database.js"></script>
    <script src="js/paineis.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
